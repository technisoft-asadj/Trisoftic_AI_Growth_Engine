# Local development dependencies. Production compose lives in infra/docker-compose.prod.yml (WP1.1 later).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: growth
      POSTGRES_PASSWORD: growth_dev_only
      POSTGRES_DB: growthengine
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth -d growthengine"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
