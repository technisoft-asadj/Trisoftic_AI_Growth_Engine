server {
  listen 80;
  client_max_body_size 210m;   # matches the API upload limit

  location /api/    { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  location /health/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }

  # Single-page app: unknown paths (including public /book/, /unsubscribe/ links) serve index.html.
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
