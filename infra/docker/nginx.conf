server {
  listen 80;
  client_max_body_size 210m;   # matches the API upload limit

  # Docker's DNS, re-asked every few seconds, so restarting the api container does not leave nginx pointing at a dead address.
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $api_upstream http://api:8080;

  # Planning and AI calls can take a minute or two; the default 60 s would cut them off.
  proxy_read_timeout 180s;

  location /api/    { proxy_pass $api_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  # Tracked short links. Only Caddy can reach this server, so the forwarded client address it appends is kept as it arrives.
  location /r/      { proxy_pass $api_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $http_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  # Short-lived signed copies of media that Instagram downloads when a post is published.
  location /m/      { proxy_pass $api_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }
  location /health/ { proxy_pass $api_upstream; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; }

  # Single-page app: unknown paths (including public /book/, /unsubscribe/ links) serve index.html.
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
